name: Release Load Gates

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target URL for load gates (e.g. https://staging.example.com)"
        required: true
        type: string
  pull_request:
    paths:
      - "tests/performance/**"
      - ".github/workflows/release-load-gates.yml"

jobs:
  load-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run k6 release gates
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/performance/release_gates.js
          flags: >-
            -e BASE_URL=${{ github.event.inputs.base_url || vars.RELEASE_GATE_BASE_URL }}
